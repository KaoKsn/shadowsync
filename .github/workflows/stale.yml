name: Perform periodic cleaning of the repo.

on:
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * *"

jobs:
    keep-fresh:
        runs-on: ubuntu-22.04
        permissions:
            issues: write
            pull-requests: write
        steps:
            - name: Cleanse stale issues and PRs.
              uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
              with:
                repo-token: ${{ secrets.GITHUB_TOKEN }}
                stale-issue-message: 'This issue has been declared stale by an automated github actions workflow.'
                stale-issue-label: 'stale-issue'
                stale-issue-message: 'This PR has been declared stale by an automated github actions workflow.'
                stale-pr-label: 'stale-pr'
