<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PII Redactor</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>PII Redactor</h1>
    <div id="ner-status" class="ner-badge ner-loading">NER: Idle</div>
  </header>

  <main>
    <!-- SETTINGS (shared by both sections) -->
    <section class="section-box settings">
      <div class="controls-row">
        <label for="style">Style:</label>
        <select id="style">
          <option value="token">Token Tag [REDACTED_TYPE]</option>
          <option value="blackout">Blackout Block (████████)</option>
          <option value="mask">Mask (•••• 1234)</option>
        </select>

        <label for="sensitivity">Sensitivity:</label>
        <select id="sensitivity">
          <option value="low">Low (fewer redactions)</option>
          <option value="balanced" selected>Balanced</option>
          <option value="high">High (redact more)</option>
        </select>

        <label class="toggle"><input type="checkbox" id="use-ner" checked> Use NER model</label>
      </div>

      <details class="lists">
        <summary>Allow / deny lists</summary>
        <div class="split-view">
          <div class="split-col">
            <label for="allow-list">Never redact (one per line, or /regex/):</label>
            <textarea id="allow-list" class="list-input" placeholder="HDFC Bank&#10;Acme Corp&#10;/INV-\d+/"></textarea>
          </div>
          <div class="split-col">
            <label for="deny-list">Always redact (one per line; optional TYPE: prefix, or /regex/):</label>
            <textarea id="deny-list" class="list-input" placeholder="EMPLOYEE_ID: /EMP-\d{5}/&#10;Project Falcon"></textarea>
          </div>
        </div>
      </details>
    </section>

    <!-- SECTION 1: TEXT REDACTION -->
    <section class="section-box">
      <h2>1. Text Redaction</h2>

      <div class="controls-row">
        <button id="btn-redact-text" class="btn">Redact Text</button>
        <span id="text-stats" class="stats"></span>
      </div>

      <div class="split-view">
        <div class="split-col">
          <label for="text-input">Input Text:</label>
          <textarea id="text-input" placeholder="Paste text here to redact..."></textarea>
        </div>
        <div class="split-col">
          <div class="col-header">
            <label>Redacted Text:</label>
            <button type="button" class="btn-sm" id="btn-copy-text">Copy</button>
          </div>
          <div id="text-output" class="output-view" aria-live="polite"></div>
        </div>
      </div>

      <table class="entity-table" id="text-entities" hidden>
        <thead><tr><th>Type</th><th>Value</th><th>Score</th><th>Detected by</th><th>Why</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- SECTION 2: HTML FILE UPLOAD -->
    <section class="section-box">
      <h2>2. HTML File Redaction</h2>

      <div class="controls-row">
        <label for="html-upload">Upload HTML File:</label>
        <input type="file" id="html-upload" accept=".html,.htm,.txt">
        <span id="html-stats" class="stats"></span>
        <button id="btn-download-html" class="btn" style="display: none; margin-left: auto;">Download Redacted HTML</button>
      </div>

      <div class="split-view">
        <div class="split-col">
          <div class="col-header">
            <label>Original HTML (Before Redaction):</label>
            <button type="button" class="btn-sm" id="toggle-orig-code">View Code</button>
          </div>
          <div class="preview-container">
            <!-- sandbox="" : uploaded pages render without running their scripts -->
            <iframe id="orig-iframe" class="preview-frame" sandbox=""></iframe>
            <textarea id="orig-code" class="code-view" readonly style="display: none;"></textarea>
          </div>
        </div>

        <div class="split-col">
          <div class="col-header">
            <label>Redacted HTML (After Redaction):</label>
            <button type="button" class="btn-sm" id="toggle-redacted-code">View Code</button>
          </div>
          <div class="preview-container">
            <iframe id="redacted-iframe" class="preview-frame" sandbox=""></iframe>
            <textarea id="redacted-code" class="code-view" readonly style="display: none;"></textarea>
          </div>
        </div>
      </div>

      <table class="entity-table" id="html-entities" hidden>
        <thead><tr><th>Type</th><th>Value</th><th>Score</th><th>Detected by</th><th>Why</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
