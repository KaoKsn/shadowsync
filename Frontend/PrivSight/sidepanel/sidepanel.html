<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrivSight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>


  <!-- ══════════════════════════════════════════════════════
       MAIN CONTENT AREA
  ══════════════════════════════════════════════════════ -->
  <main class="ps-main" id="ps-main">

    <!-- ── Chat messages (scrollable) ──────────────────── -->
    <div class="ps-chat" id="ps-chat" role="log" aria-live="polite">

      <!-- IDLE PLACEHOLDER (shown when no messages) -->
      <div class="ps-idle" id="ps-idle">
        <div class="ps-idle__icon">
          <svg width="32" height="32" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 1.25 2.25 3v4.25C2.25 10.25 4.5 12.25 7 13.25c2.5-1 4.75-3 4.75-6V3L7 1.25Z"
                  stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
            <path d="M5 7.25 6.5 8.75 9.5 5.75"
                  stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="ps-idle__title">How can I help on this page?</h2>
        <p class="ps-idle__sub">PrivSight can interact with the current page while keeping your sensitive information protected.</p>
      </div>

      <!-- MESSAGES will be injected here by sidepanel.js -->

    </div>

    <!-- ── Agent activity log (visible while working) ──── -->
    <div class="ps-activity" id="ps-activity" aria-hidden="true">
      <p class="ps-activity__title" id="ps-activity-title">Working on this page</p>
      <ul class="ps-activity__steps" id="ps-activity-steps">
        <!-- Steps injected by JS -->
      </ul>
    </div>

  </main>

  <!-- ══════════════════════════════════════════════════════
       BOTTOM TOOLBAR — input + quick actions + stats
  ══════════════════════════════════════════════════════ -->
  <footer class="ps-footer" id="ps-footer">

    <!-- Slim control bar (replaces the removed header) -->
    <div class="ps-toolbar" id="ps-toolbar">
      <!-- Left: logo + status -->
      <div class="ps-toolbar__left">
        <div class="ps-logo" id="ps-logo">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 1.25 2.25 3v4.25C2.25 10.25 4.5 12.25 7 13.25c2.5-1 4.75-3 4.75-6V3L7 1.25Z"
                  stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M5 7.25 6.5 8.75 9.5 5.75"
                  stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="ps-status-badge" id="ps-status-badge">
          <span class="ps-status-dot" id="ps-status-dot"></span>
          <span class="ps-status-text" id="ps-status-text">Ready</span>
        </div>
      </div>
      <!-- Right: dashboard + theme -->
      <div class="ps-toolbar__right">
        <button class="ps-icon-btn ps-dashboard-btn" id="ps-dashboard-btn" title="Open Analytics Dashboard" aria-label="Open Dashboard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
        </button>
        <button class="ps-icon-btn" id="ps-theme-toggle" title="Toggle theme" aria-label="Toggle theme">
          <svg id="ps-icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg id="ps-icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          </svg>
        </button>
        <!-- Close (hidden by default since Chrome provides one) -->
        <button class="ps-icon-btn ps-close-btn" id="ps-close-btn" title="Close panel" aria-label="Close panel" style="display:none;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="ps-quick-actions" id="ps-quick-actions">
      <span class="ps-quick-actions__label">Try asking</span>
      <div class="ps-quick-actions__chips">
        <button class="ps-chip" data-prompt="Find something on this page" id="ps-chip-find">Find something</button>
        <button class="ps-chip" data-prompt="Fill out this form" id="ps-chip-form">Fill a form</button>
        <button class="ps-chip" data-prompt="Summarize this page" id="ps-chip-summarize">Summarize</button>
      </div>
    </div>

    <!-- Input row -->
    <div class="ps-input-row" id="ps-input-row">
      <div class="ps-input-wrap">
        <input
          type="text"
          class="ps-input"
          id="ps-input"
          placeholder="Ask PrivSight to do something..."
          autocomplete="off"
          maxlength="500"
          aria-label="Ask PrivSight"
        />
        <button class="ps-send-btn" id="ps-send-btn" aria-label="Send" title="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Privacy protection stats -->
    <div class="ps-privacy" id="ps-privacy">
      <div class="ps-privacy__header">
        <span class="ps-privacy__label">Privacy Protection</span>
        <span class="ps-privacy__badge" id="ps-privacy-badge">
          <span class="ps-priv-dot" id="ps-priv-dot"></span>
          <span id="ps-privacy-badge-text">Protected</span>
        </span>
      </div>
      <div class="ps-privacy__stats">
        <div class="ps-stat">
          <span class="ps-stat__num" id="ps-stat-found">0</span>
          <span class="ps-stat__lbl">Data found</span>
        </div>
        <div class="ps-stat__arrow">→</div>
        <div class="ps-stat">
          <span class="ps-stat__num" id="ps-stat-recognized">0</span>
          <span class="ps-stat__lbl">Sensitive</span>
        </div>
        <div class="ps-stat__arrow">→</div>
        <div class="ps-stat">
          <span class="ps-stat__num" id="ps-stat-removed">0</span>
          <span class="ps-stat__lbl">Removed</span>
        </div>
      </div>
      <div class="ps-privacy__bar" id="ps-privacy-bar">
        <div class="ps-privacy__bar-fill" id="ps-privacy-bar-fill"></div>
      </div>
    </div>

  </footer>
  <script src="lib/marked.umd.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
