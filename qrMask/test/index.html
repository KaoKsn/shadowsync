<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Mask visual test</title>
  <style>
    body { margin: 2rem; font: 16px system-ui, sans-serif; background: #f3f4f6; color: #111827; }
    main { max-width: 1100px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    figure { margin: 0; padding: 1rem; background: white; border: 1px solid #d1d5db; }
    img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    figcaption { margin-bottom: .75rem; font-weight: 700; }
    #status { min-height: 1.5rem; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>QR masking</h1>
    <p id="status">Running...</p>
    <div class="grid">
      <figure><figcaption>Before</figcaption><img id="before" src="qr-sample.svg" alt="QR code test image"></figure>
      <figure><figcaption>After</figcaption><img id="after" alt="Masked QR code test image"></figure>
    </div>
  </main>
  <script src="../jsQR.min.js"></script>
  <script src="../qrRedaction.js"></script>
  <script>
    (async () => {
      const source = document.getElementById('before');
      const status = document.getElementById('status');
      try {
        await source.decode();
        const response = await fetch(source.src);
        const blob = await response.blob();
        const reader = new FileReader();
        const dataUrl = await new Promise((resolve, reject) => {
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
        document.getElementById('after').src = await window.qrRedaction(dataUrl, { debug: true });
        status.textContent = 'Complete. Compare the solid black masks with the QR locations.';
      } catch (error) {
        status.textContent = 'Test failed: ' + error.message;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
